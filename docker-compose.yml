services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pagecord_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  memcached:
    image: memcached:latest
    ports:
      - "11211:11211"

  web:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    # Chromium needs more than the default 64MB of /dev/shm for system tests
    shm_size: "1gb"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      memcached:
        condition: service_started
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      MEMCACHE_SERVERS: memcached:11211
      RAILS_ENV: development
      # Tells the system tests to use the container's Chromium
      RUNNING_IN_DOCKER: "true"
    volumes:
      - .:/rails
    stdin_open: true
    tty: true
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails db:test:prepare && (bin/rails tailwindcss:watch & exec bin/rails server -b 0.0.0.0)"


volumes:
  postgres_data:
