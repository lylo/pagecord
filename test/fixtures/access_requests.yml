joel:
  user: joel
  token_digest: <%= AccessRequest.digest("joel-token") %>
  expires_at: <%= 1.day.ago %>
  accepted_at: <%= 2.days.ago %>

elliot:
  user: elliot
  token_digest: <%= AccessRequest.digest("elliot-token") %>
  expires_at: <%= 2.days.from_now %>

elliot_expired:
  user: elliot
  token_digest: <%= AccessRequest.digest("elliot-expired-token") %>
  expires_at: <%= 2.days.ago %>
