DEFAULTS: &default
  blog: joel
  client_name: Claude
  redirect_uri: https://claude.ai/api/mcp/auth_callback
  client_id: <%= Oauth::Client.register(name: "Claude", redirect_uris: [ "https://claude.ai/api/mcp/auth_callback" ]) %>

joel_claude:
  <<: *default
  token_digest: <%= Digest::SHA256.hexdigest("test_mcp_token") %>

joel_pending:
  <<: *default
  code_digest: <%= Digest::SHA256.hexdigest("test_mcp_code") %>
  code_challenge: <%= Base64.urlsafe_encode64(Digest::SHA256.digest("test_verifier"), padding: false) %>
  code_expires_at: <%= 5.minutes.from_now %>
